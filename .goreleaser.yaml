version: 2

project_name: goveetl

before:
  hooks:
    - go mod tidy

builds:
  - id: goveetl
    main: ./cmd/goveetl
    binary: goveetl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jwmoss/goveetl/internal/cli.version={{ .Version }}
      - -X github.com/jwmoss/goveetl/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/jwmoss/goveetl/internal/cli.date={{ .Date }}

archives:
  - id: goveetl
    ids:
      - goveetl
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: jwmoss
    name: goveetl
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

brews:
  - name: goveetl
    ids:
      - goveetl
    repository:
      owner: jwmoss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jwmoss/goveetl"
    description: "Command-line client for Govee cloud, app, and LAN APIs"
    license: MIT
    install: |
      bin.install "goveetl"
    test: |
      system "#{bin}/goveetl", "version"
